name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Dummy credentials for tests — no real Telegram/Google API calls are made in the suite.
      TELEGRAM_BOT_TOKEN: "123456789:TEST-TOKEN-FOR-CI-ONLY"
      MY_TELEGRAM_USER_ID: "123456789"
      GOOGLE_API_KEY: "test-google-api-key-for-ci-only"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-no-deps.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r requirements-no-deps.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v
